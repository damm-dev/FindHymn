<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Find Hymn Remote</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="icon" type="image/png" href="/logoblack.png">
    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <img src="/logoblack.png" alt="Logo" class="app-logo">
            <span class="app-title">Find Hymn</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <div id="status-badge" class="status-badge disconnected">
                <span style="width:6px; height:6px; border-radius:50%; background:currentColor;"></span>
                <span>Desconectado</span>
            </div>
            <button class="btn-icon" title="Monitores" onclick="openMonitorModal()">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                    <line x1="8" y1="21" x2="16" y2="21" />
                    <line x1="12" y1="17" x2="12" y2="21" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Scrollable Area -->
    <main>
        <!-- Source Selector (Anterior / Nuevo / Ambos) -->
        <div class="segmented-control">
            <label class="segment-opt">
                <input type="radio" name="source" value="previous" checked onchange="handleSearch()">
                <span>Anterior</span>
            </label>
            <label class="segment-opt">
                <input type="radio" name="source" value="new" onchange="handleSearch()">
                <span>Nuevo</span>
            </label>
            <label class="segment-opt">
                <input type="radio" name="source" value="both" onchange="handleSearch()">
                <span>Ambos</span>
            </label>
        </div>

        <!-- Sub Tabs (Cantado / Pista) -->
        <div id="subTabs" class="sub-tabs">
            <label class="sub-opt">
                <input type="radio" name="subcat" value="Cantado" checked onchange="handleSearch()">
                <span>Cantado</span>
            </label>
            <label class="sub-opt">
                <input type="radio" name="subcat" value="Pista" onchange="handleSearch()">
                <span>Pista</span>
            </label>
        </div>

        <!-- Search Bar -->
        <div class="search-wrapper">
            <div class="search-icon-left">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input type="text" id="searchInput" class="search-input-box" placeholder="Buscar por número o título..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()">✕</button>
        </div>

        <!-- Results List -->
        <div id="results">
            <div style="text-align:center; color:#94a3b8; margin-top:30px; font-size:14px; font-weight:500;">
                Escribe para buscar un himno...
            </div>
        </div>
    </main>

    <!-- Fixed Bottom Control Center -->
    <div class="fixed-player">
        <!-- 1. Top Edge Scrubber (Desktop Style Flush Top) -->
        <div class="seek-wrapper">
            <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" oninput="seeking()" onchange="seekEnd()">
        </div>

        <!-- 2. Song Information (Purely Centered) -->
        <div class="now-playing">
            <div class="np-title" id="npTitle">Sin reproducción</div>
            <div class="np-meta" id="npMeta">Selecciona un himno para proyectar</div>
        </div>

        <!-- 3. Timestamps Row -->
        <div class="time-row">
            <span id="timeCurr">0:00</span>
            <span id="timeTot">0:00</span>
        </div>

        <!-- 4. Primary Transport Controls (Symmetric 5 Buttons: 2 Left, 1 Center, 2 Right) -->
        <div class="controls-bar">
            <!-- 1. Loop Button -->
            <button class="c-btn" id="btnLoop" title="Repetir" onclick="toggleLoop()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                </svg>
            </button>

            <!-- 2. Previous Button -->
            <button class="c-btn" title="Anterior" onclick="sendCommand('prev')">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>

            <!-- 3. Big Central Play / Pause Hero Button -->
            <div class="play-btn-wrapper">
                <div class="play-btn" id="playBtn" onclick="sendCommand('playPause')">
                    <svg id="iconPlay" viewBox="0 0 24 24" style="margin-left: 2px;">
                        <path d="M8 5v14l11-7z" fill="white" />
                    </svg>
                    <svg id="iconPause" viewBox="0 0 24 24" style="display:none">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="white" />
                    </svg>
                </div>
            </div>

            <!-- 4. Next Button -->
            <button class="c-btn" title="Siguiente" onclick="sendCommand('next')">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>

            <!-- 5. Stop Button -->
            <button class="c-btn" title="Detener" onclick="sendCommand('stop')">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 6h12v12H6z" />
                </svg>
            </button>
        </div>

        <!-- 5. Bottom Utility Bar (Live on Left, Volume in Center, Fullscreen on Right) -->
        <div class="player-bottom-utility">
            <!-- Live Button -->
            <button class="live-btn-pill" id="btnLive" onclick="toggleLive()">
                <div class="live-dot"></div>
                <span>CERRADO</span>
            </button>

            <!-- Volume Slider in Center -->
            <div class="vol-box" title="Volumen">
                <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                </svg>
                <input type="range" class="vol-slider" min="0" max="100" value="100" oninput="sendCommand('volume', {value: this.value})">
                <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </div>

            <!-- Fullscreen Button -->
            <button class="c-btn-utility" id="btnFullscreen" title="Pantalla Completa" onclick="sendCommand('fullscreen')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Monitor Modal -->
    <div id="monitorModal" class="modal-overlay" onclick="if(event.target===this) closeMonitorModal()">
        <div class="modal-card">
            <h3 style="margin:0 0 16px 0; text-align:center; font-size:16px; font-weight:800; color:#0f172a;">Seleccionar Pantalla</h3>
            <div id="monitorLoading" style="text-align:center; color:#94a3b8; font-size:13px; padding:12px;">Buscando pantallas...</div>
            <div id="monitorList" style="display:flex; flex-direction:column; gap:8px;"></div>
            <button onclick="closeMonitorModal()"
                style="width:100%; padding:12px; margin-top:16px; background:#f1f5f9; border:none; border-radius:12px; font-weight:700; font-size:14px; color:#475569; cursor:pointer;">Cerrar</button>
        </div>
    </div>

    <!-- Login Overlay -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2 class="login-title">Conexión Segura</h2>
            <input type="password" id="loginKeyword" class="login-input" placeholder="Ingresa la palabra clave">
            <button id="btnLogin" class="login-btn">Ingresar</button>
            <div id="loginError" class="login-error">Palabra clave incorrecta</div>
        </div>
    </div>

    <script>
        const socket = io();
        const badge = document.getElementById('status-badge');

        // AUTH HANDLERS
        let authEnabled = false;
        socket.on('auth_required', (data) => {
            authEnabled = data.required;
            if (authEnabled) {
                document.getElementById('loginOverlay').style.display = 'flex';
            } else {
                document.getElementById('loginOverlay').style.display = 'none';
                socket.emit('login', '');
            }
        });

        socket.on('auth_result', (data) => {
            if (data.success) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('loginError').style.display = 'none';
                document.getElementById('loginKeyword').value = '';
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('loginKeyword').style.borderColor = '#ef4444';
            }
        });

        const btnLogin = document.getElementById('btnLogin');
        const inputLogin = document.getElementById('loginKeyword');
        if (btnLogin) {
            btnLogin.addEventListener('click', () => {
                socket.emit('login', inputLogin.value.trim());
            });
        }

        const resultsDiv = document.getElementById('results');
        const searchInput = document.getElementById('searchInput');
        let debounceTimer;

        // UI Refs
        const npTitle = document.getElementById('npTitle');
        const npMeta = document.getElementById('npMeta');
        const timeCurr = document.getElementById('timeCurr');
        const timeTot = document.getElementById('timeTot');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const seekSlider = document.getElementById('seekSlider');
        const btnLive = document.getElementById('btnLive');
        const btnLoop = document.getElementById('btnLoop');
        const subTabs = document.getElementById('subTabs');

        let isSeeking = false;
        let isLive = false;
        let isLoop = false;

        // SOCKET
        socket.on('connect', () => {
            badge.innerHTML = '<span style="width:6px; height:6px; border-radius:50%; background:currentColor;"></span><span>Conectado</span>';
            badge.className = "status-badge connected";
            socket.emit('register', 'mobile');
            sendCommand('get-status');
            sendCommand('get-live-state');
        });

        socket.on('disconnect', () => {
            badge.innerHTML = '<span style="width:6px; height:6px; border-radius:50%; background:currentColor;"></span><span>Desconectado</span>';
            badge.className = "status-badge disconnected";
        });

        socket.on('status', (msg) => {
            try {
                if (msg.type === 'search-results') renderResults(msg.data);
                else if (msg.type === 'sync-status') updatePlayerState(msg.data);
                else if (msg.type === 'monitors-list') renderMonitors(msg.data);
                else if (msg.type === 'live-state') {
                    isLive = msg.data.active;
                    updateLiveBtn();
                }
            } catch (e) { console.error(e); }
        });

        // MONITORS
        function closeMonitorModal() {
            const el = document.getElementById('monitorModal');
            if (!el) return;
            el.style.display = 'none';
        }

        function openMonitorModal() {
            document.getElementById('monitorModal').style.display = 'flex';
            document.getElementById('monitorList').innerHTML = '';
            document.getElementById('monitorLoading').style.display = 'block';
            sendCommand('get-monitors');
        }

        function renderMonitors(data) {
            document.getElementById('monitorLoading').style.display = 'none';
            const container = document.getElementById('monitorList');
            container.innerHTML = '';

            let list = [];
            let selected = null;
            if (Array.isArray(data)) list = data;
            else if (data && data.list) { list = data.list; selected = data.selected; }

            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:13px;">No se encontraron pantallas adicionales.</div>';
                return;
            }

            list.forEach(m => {
                const btn = document.createElement('button');
                btn.style.cssText = "padding:12px 14px; border-radius:12px; border:1px solid #e2e8f0; background:#f8fafc; text-align:left; font-size:13px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center;";
                let label = m.label || `Monitor ${m.id}`;
                if (m.id === selected) {
                    btn.style.background = '#eff6ff';
                    btn.style.borderColor = '#3b82f6';
                    btn.style.color = '#1d4ed8';
                    btn.innerHTML = `<span>${label}</span><span style="font-weight:800;">✓</span>`;
                } else {
                    btn.innerText = label;
                }
                btn.onclick = () => {
                    sendCommand('set-monitor', { id: m.id });
                    closeMonitorModal();
                };
                container.appendChild(btn);
            });
        }

        // SEARCH
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('clearBtn').style.display = val ? 'flex' : 'none';
            clearTimeout(debounceTimer);
            if (!val.trim()) { renderResults(null); return; }
            debounceTimer = setTimeout(handleSearch, 250);
        });

        function handleSearch() {
            const source = document.querySelector('input[name="source"]:checked').value;

            if (source === 'new' || source === 'both') {
                subTabs.classList.add('visible');
            } else {
                subTabs.classList.remove('visible');
            }

            const query = searchInput.value;
            if (!query) return;

            let category = 'Cantado';
            const sub = document.querySelector('input[name="subcat"]:checked');
            if (sub) category = sub.value;

            sendCommand('search', { query, source, category });
        }

        function clearSearch() {
            searchInput.value = '';
            document.getElementById('clearBtn').style.display = 'none';
            renderResults(null);
            searchInput.focus();
        }

        function renderResults(items) {
            resultsDiv.innerHTML = '';
            if (!items || !items.length) {
                resultsDiv.innerHTML = `<div style="text-align:center; color:#94a3b8; margin-top:30px; font-size:13px; font-weight:500;">${items === null ? 'Escribe para buscar un himno...' : 'No se encontraron resultados'}</div>`;
                return;
            }
            items.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'result-item';
                let tagText = item.sourceTab === 'previous' ? 'ANT' : 'NUE';

                el.style.animation = `slideUpFade 0.25s ease forwards`;
                el.style.animationDelay = `${index * 0.025}s`;
                el.style.opacity = '0';

                el.innerHTML = `
                    <span class="res-title">${item.display}</span>
                    <span class="res-tag ${item.sourceTab === 'previous' ? 'ant' : 'nue'}">${tagText}</span>
                `;
                el.onclick = () => {
                    sendCommand('play', { file: item.file, tab: item.sourceTab, category: item.category || 'Cantado', display: item.display });
                    npTitle.textContent = item.display;
                    isLive = true;
                    updateLiveBtn();
                };
                resultsDiv.appendChild(el);
            });
        }

        // PLAYER
        function updatePlayerState(data) {
            if (data.type === 'stopped') { resetUI(); return; }
            if (data.title) npTitle.textContent = data.title;
            if (data.number) npMeta.textContent = `Himno ${data.number}`;
            if (data.currentTime !== undefined && data.duration) {
                const pct = (data.currentTime / data.duration) * 100;
                if (!isSeeking) {
                    seekSlider.value = pct;
                    updateSeekVis(pct);
                    timeCurr.textContent = fmtTime(data.currentTime);
                    timeTot.textContent = fmtTime(data.duration);
                }
            }
            if (data.type === 'play') { iconPlay.style.display = 'none'; iconPause.style.display = 'block'; }
            else if (data.type === 'pause') { iconPlay.style.display = 'block'; iconPause.style.display = 'none'; }
        }

        function resetUI() {
            npTitle.textContent = "Sin reproducción";
            npMeta.textContent = "-";
            seekSlider.value = 0;
            updateSeekVis(0);
            timeCurr.textContent = "0:00";
            timeTot.textContent = "0:00";
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
        }

        function seeking() {
            isSeeking = true;
            updateSeekVis(seekSlider.value);
        }

        function seekEnd() {
            isSeeking = false;
            sendCommand('seek-percent', { percent: seekSlider.value });
        }

        function updateSeekVis(pct) {
            seekSlider.style.setProperty('--seek-val', pct + '%');
        }

        function toggleLoop() {
            isLoop = !isLoop;
            btnLoop.classList.toggle('active', isLoop);
            sendCommand('loop', { value: isLoop });
        }

        function toggleLive() {
            isLive = !isLive;
            updateLiveBtn();
            sendCommand('toggle-live', { active: isLive });
        }

        function updateLiveBtn() {
            if (isLive) {
                btnLive.classList.add('live-active');
            } else {
                btnLive.classList.remove('live-active');
            }
            btnLive.querySelector('span').innerText = isLive ? "EN CURSO" : "CERRADO";
        }

        function fmtTime(s) {
            if (!s) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        function sendCommand(a, p = {}) {
            socket.emit('command', { action: a, ...p });
            if (navigator.vibrate) navigator.vibrate(8);
        }
    </script>
</body>

</html>
